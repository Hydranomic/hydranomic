<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Redefinição de Senha | Hydronomic</title>

    <link rel="stylesheet" href="css/login.css" />
</head>

<body>

    <!-- Imagem de fundo -->
    <section class="imagem-fundo"></section>

    <!-- Conteúdo principal -->
    <main class="pagina">

        <!-- Cartão de redefinição -->
        <section class="esqueceu-senha" aria-label="Redefinição de senha Hydronomic">

            <form class="redefinicao_senha">

                <h1>Esqueceu sua senha?</h1>

                <h2>Redefina sua senha</h2>

                <label class="oculto" for="email">
                    E-mail
                </label>

                <input
                    class="campo-email"
                    id="email"
                    name="email"
                    type="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                />

                <button
                    class="botao-terciario-cadastro"
                    type="submit"
                >
                    ENVIAR
                </button>

            </form>

        </section>

    </main>

</body>

</html>
