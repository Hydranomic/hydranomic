<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Navbar Hydranomic</title>

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <link rel="stylesheet" href="css/navbar.css">
</head>

<body>

  <nav class="navbar">

    <div class="logo-area">

      <!-- Botão das três barras -->
      <button
        class="menu"
        id="abrirSidebar"
        type="button"
        aria-label="Abrir menu lateral"
        aria-expanded="false"
      >
        <i class="bi bi-list"></i>
      </button>

      <img
        src="assets/logo_hydranomic.png.png"
        alt="Logo Hydranomic"
        class="logo-img"
      >

      <a href="#" class="logo">
        <span class="hydra">HYDRA</span><span class="nomic">NOMIC</span>
      </a>

    </div>

    <div class="perfil">

      <button
        class="perfil-botao"
        id="abrirPerfil"
        type="button"
        aria-expanded="false"
        aria-controls="perfilCard"
        aria-label="Abrir perfil de User"
      >
        <span class="avatar avatar-nav">
          <i class="bi bi-person-circle"></i>
        </span>

        <span class="usuario">
          <strong>Olá, User!</strong>
          <small>Administrador</small>
        </span>

        <span class="seta">
          <i class="bi bi-chevron-down"></i>
        </span>
      </button>

      <div
        class="perfil-card"
        id="perfilCard"
        hidden
      >

        <div class="perfil-topo">

          <span class="avatar avatar-modal">
            <i class="bi bi-person-circle"></i>
          </span>

          <div>
            <h2>User</h2>
            <p>Administrador</p>
          </div>

        </div>

        <!-- Informações do usuário -->
        <div class="informacoes">

          <p>
            <span>
              <i class="bi bi-pin-map"></i>
            </span>

            <b>Estabelecimento</b>
            <small>Colégio Central Smart</small>
          </p>

          <p>
            <span>
              <i class="bi bi-briefcase"></i>
            </span>

            <b>CNPJ</b>
            <small>12.345.678/0001-90</small>
          </p>

          <p>
            <span>
              <i class="bi bi-award"></i>
            </span>

            <b>Cargo</b>
            <small>Administrador</small>
          </p>

          <p>
            <span>
              <i class="bi bi-envelope"></i>
            </span>

            <b>Email</b>
            <small>user@colegiocentralsmart.com</small>
          </p>

          <p>
            <span>
              <i class="bi bi-clock-history"></i>
            </span>

            <b>Último acesso</b>
            <small>25/08/2026 às 21:19</small>
          </p>

        </div>

        <!-- Ações -->
        <div class="acoes">

          <hr class="linha-acoes">

          <button type="button">
            <i class="bi bi-gear"></i>
            Configurações
          </button>

          <button type="button" class="sair">
            <i class="bi bi-box-arrow-right"></i>
            Sair da conta
          </button>

        </div>

      </div>

    </div>

  </nav>

  <!-- Fundo da sidebar -->
  <button
    class="sidebar-backdrop"
    id="fecharSidebarFundo"
    type="button"
    aria-label="Fechar menu lateral"
    hidden
  ></button>

  <!-- Sidebar -->
  <aside
    class="sidebar"
    id="sidebar"
    aria-label="Menu lateral"
    hidden
  >

    <div class="sidebar-topo">

      <img
        src="assets/logo_hydranomic.png.png"
        alt="Hydranomic"
        class="sidebar-logo"
      >

      <button
        class="sidebar-fechar"
        id="fecharSidebar"
        type="button"
        aria-label="Fechar menu lateral"
      >
        <i class="bi bi-x-lg"></i>
      </button>

    </div>

    <nav class="sidebar-menu">

      <a href="#inicio">
        Página inicial
      </a>

      <a href="#definicoes">
        Definições
      </a>

      <a href="#metas-consumo">
        Metas de consumo /financeiro
      </a>

      <a href="#relatorio-consumo">
        Relatório de conumo
      </a>

    </nav>

    <button
      class="sidebar-sair"
      type="button"
    >
      Sair
    </button>

  </aside>

  <script>
    /* Modal do perfil */
    const botaoPerfil = document.getElementById("abrirPerfil" );
    const perfilCard = document.getElementById("perfilCard");

    botaoPerfil.addEventListener("click", function (evento) {
      evento.stopPropagation();

      const perfilAberto =
        botaoPerfil.getAttribute("aria-expanded") === "true";

      botaoPerfil.setAttribute(
        "aria-expanded",
        String(!perfilAberto)
      );

      perfilCard.hidden = perfilAberto;
    });

    document.addEventListener("click", function (evento) {
      if (!evento.target.closest(".perfil")) {
        botaoPerfil.setAttribute("aria-expanded", "false");
        perfilCard.hidden = true;
      }
    });

    /* Sidebar */
    const abrirSidebar = document.getElementById("abrirSidebar");
    const fecharSidebar = document.getElementById("fecharSidebar");
    const fecharSidebarFundo = document.getElementById("fecharSidebarFundo");
    const sidebar = document.getElementById("sidebar");

    abrirSidebar.addEventListener("click", function () {
      sidebar.hidden = false;
      fecharSidebarFundo.hidden = false;

      abrirSidebar.setAttribute("aria-expanded", "true");

      // Fecha a modal do perfil ao abrir a sidebar
      botaoPerfil.setAttribute("aria-expanded", "false");
      perfilCard.hidden = true;
    });

    function fecharMenuLateral() {
      sidebar.hidden = true;
      fecharSidebarFundo.hidden = true;

      abrirSidebar.setAttribute("aria-expanded", "false");
    }

    fecharSidebar.addEventListener(
      "click",
      fecharMenuLateral
    );

    fecharSidebarFundo.addEventListener(
      "click",
      fecharMenuLateral
    );

    document.addEventListener("keydown", function (evento) {
      if (evento.key === "Escape") {
        fecharMenuLateral();

        botaoPerfil.setAttribute("aria-expanded", "false");
        perfilCard.hidden = true;
      }
    });

    document
      .querySelectorAll(".sidebar-menu a")
      .forEach(function (link) {
        link.addEventListener(
          "click",
          fecharMenuLateral
        );
      });
  </script>

</body>
</html>
