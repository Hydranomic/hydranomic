<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Navbar Hydranomic</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <link rel="stylesheet" href="css/navbar.css">
</head>

<body>

  <nav class="navbar">

    <div class="logo-area">

      <button class="menu" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>

      <img
        src="assets/logo_hydranomic.png.png"
        alt="Logo Hydranomic"
        class="logo-img"
      >

      <a href="#" class="logo">
        <span class="hydra">HYDRA</span><span class="nomic">NOMIC</span>
      </a>

    </div>

    <div class="perfil">

      <button
        class="perfil-botao"
        id="abrirPerfil"
        aria-expanded="false"
        aria-controls="perfilCard"
      >
        <span class="avatar avatar-nav">
          <i class="bi bi-person-circle"></i>
        </span>

        <span class="usuario">
          <strong>Olá, User!</strong>
          <small>Administrador</small>
        </span>

        <span class="seta">
          <i class="bi bi-chevron-down"></i>
        </span>

      </button>

      <div
        class="perfil-card"
        id="perfilCard"
        hidden
      >

        <div class="perfil-topo">

          <span class="avatar avatar-modal">
            <i class="bi bi-person-circle"></i>
          </span>

          <div>
            <h2>User</h2>
            <p>Administrador</p>
          </div>

        </div>

        <!-- Informações do usuário -->
        <div class="informacoes">

          <p>
            <span>
              <i class="bi bi-pin-map"></i>
            </span>

            <b>Estabelecimento</b>
            <small>Colégio Central Smart</small>
          </p>

          <p>
            <span>
              <i class="bi bi-briefcase"></i>
            </span>

            <b>CNPJ</b>
            <small>12.345.678/0001-90</small>
          </p>

          <p>
            <span>
              <i class="bi bi-award"></i>
            </span>

            <b>Cargo</b>
            <small>Administrador</small>
          </p>

          <p>
            <span>
              <i class="bi bi-envelope"></i>
            </span>

            <b>Email</b>
            <small>user@colegiocentralsmart.com</small>
          </p>

          <p>
            <span>
              <i class="bi bi-clock-history"></i>
            </span>

            <b>Último acesso</b>
            <small>25/08/2026 às 21:19</small>
          </p>

        </div>

        <!-- Ações -->
      <div class="acoes">

        <hr class="linha-acoes">

        <button type="button">
          <i class="bi bi-gear"></i>
          Configurações
        </button>

        <button type="button" class="sair">
          <i class="bi bi-box-arrow-right"></i>
          Sair da conta
        </button>

      </div>

        </div>

      </div>

    </div>

  </nav>

  <script>
    const botaoPerfil = document.getElementById("abrirPerfil" );
    const perfilCard = document.getElementById("perfilCard");

    botaoPerfil.addEventListener("click", function () {
      const perfilAberto =
        botaoPerfil.getAttribute("aria-expanded") === "true";

      botaoPerfil.setAttribute(
        "aria-expanded",
        String(!perfilAberto)
      );

      perfilCard.hidden = perfilAberto;
    });

    document.addEventListener("click", function (evento) {
      const clicouDentroDoPerfil =
        evento.target.closest(".perfil");

      if (!clicouDentroDoPerfil) {
        botaoPerfil.setAttribute("aria-expanded", "false");
        perfilCard.hidden = true;
      }
    });
  </script>

</body>
</html>
