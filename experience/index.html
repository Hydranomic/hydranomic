<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página Inicial</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/relatorio.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div id="navbar-container"></div>

    <main>

        <h1>Olá, </h1>
        <h3>Aqui está o resumo do sistema</h3>

        <section class="area-vazao">
            <i class="bi bi-graph-up"></i>
            <h3>Vazão atual da água</h3>
            <h1></h1>
            <button-ver-detalhes>Ver detalhes</button-ver-detalhes>
        </section>

        <section class="area-status">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <h3>Status do sistema</h3>
            <h1></h1>
            <h3></h3>
            <button-ver-detalhes>Ver detalhes</button-ver-detalhes>
        </section>

                <section class="area-consumo-agua">

    <div class="titulo-consumo">
        <i class="bi bi-droplet"></i>
        <h3>Consumo de água</h3>
    </div>

    <div class="grafico-consumo">
        <canvas id="graficoConsumo"></canvas>
    </div>

</section>

        <section class="area-previsoes">
            <i class="bi bi-check-all"></i>
            <h3>Previsões</h3>
            <h3>Previsão financeira do próximo mês</h3>
            <h1></h1>
        </section>

        <section class="metas">
            <i class="bi bi-cash-coin"></i>
            <h3>Metas</h3>

            <h3>Gasto total do mês</h3>
            <h1></h1>

            <h3>Consumo total de água</h3>
            <h1></h1>

            <button-ver-relatorio>
                Ver relatório financeiro
            </button-ver-relatorio>
        </section>

    </main>

    <script>
    const grafico = document.getElementById('graficoConsumo');

    new Chart(grafico, {
        type: 'line',

        data: {
            labels: [
                'Jan',
                'Fev',
                'Mar',
                'Abr',
                'Mai',
                'Jun',
                'Jul',
                'Ago',
                'Set',
                'Out',
                'Nov',
                'Dez'
            ],

            datasets: [{
                label: 'Consumo de água',

                data: [
                    435,
                    515,
                    560,
                    475,
                    590,
                    625,
                    680,
                    620,
                    570,
                    520,
                    490,
                    430
                ],

                borderColor: '#205988',
                backgroundColor: 'rgba(32, 89, 136, 0.10)',

                borderWidth: 2,

                pointRadius: 3,
                pointBackgroundColor: '#205988',

                tension: 0.3,

                fill: true
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    display: false
                }
            },

            scales: {
                y: {
                    min: 300,
                    max: 700,

                    ticks: {
                        stepSize: 100,

                        callback: function(valor) {
                            return valor + 'k';
                        }
                    },

                    grid: {
                        color: '#f1f5f9'
                    }
                },

                x: {
                    grid: {
                        display: false
                    }
                }
            }
        }
    });
</script>

    <script>
        fetch("navbar.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível carregar a navbar.");
                }

                return response.text();
            })
            .then(html => {
                const parser = new DOMParser();
                const documento = parser.parseFromString(html, "text/html");

                const container = document.getElementById("navbar-container");

                Array.from(documento.body.children).forEach(elemento => {
                    if (elemento.tagName !== "SCRIPT") {
                        container.appendChild(
                            document.importNode(elemento, true)
                        );
                    }
                });

                documento.querySelectorAll("script").forEach(scriptOriginal => {
                    const novoScript = document.createElement("script");

                    if (scriptOriginal.src) {
                        novoScript.src = scriptOriginal.src;
                    } else {
                        novoScript.textContent = scriptOriginal.textContent;
                    }

                    document.body.appendChild(novoScript);
                });
            })
            .catch(erro => {
                console.error(erro);
            });
    </script>

</body>
</html>
